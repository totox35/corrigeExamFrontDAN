<div class="entity-list">
  <h2 jhiTranslate="global.menu.entities.list.responsegrouplist">Response Group List</h2>
  <div class="mb-3">
    <input #questionId type="number" class="form-control w-25 d-inline me-2" placeholder="Enter Exam ID" />
    <button
      type="button"
      class="btn btn-danger"
      jhiTranslate="global.menu.entities.list.delresponsegroupbyid"
      (click)="deleteByQuestion(questionId.value)"
    >
      <i class="fa fa-trash"></i> Delete All Response Groups for Exam
    </button>
    <button
      type="button"
      class="btn btn-danger"
      jhiTranslate="global.menu.entities.list.delallresponsegroups"
      (click)="deleteAllResponseGroups()"
    >
      <i class="fa fa-trash"></i> Delete All Response Groups
    </button>
  </div>
  <table class="table table-striped">
    <thead>
      <tr>
        <th jhiTranslate="global.menu.entities.list.id">ID</th>
        <th jhiTranslate="global.menu.entities.list.questionid">Question ID</th>
        <th jhiTranslate="global.menu.entities.list.predictionids">Prediction IDs</th>
        <th jhiTranslate="global.menu.entities.list.actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let responseGroup of responseGroups">
        <td>{{ responseGroup.id }}</td>
        <td>{{ responseGroup.questionId }}</td>
        <td>{{ responseGroup.predictionIds?.join(', ') }}</td>
        <td>
          <div class="btn-group">
            <button
              type="submit"
              [routerLink]="['/response-group', responseGroup.id, 'view']"
              class="btn btn-info btn-sm"
              data-cy="entityDetailsButton"
            >
              <fa-icon icon="eye"></fa-icon>
              <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
            </button>
            <button
              type="submit"
              [routerLink]="['/response-group', responseGroup.id, 'edit']"
              class="btn btn-primary btn-sm"
              data-cy="entityEditButton"
            >
              <fa-icon icon="pencil-alt"></fa-icon>
              <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
            </button>
            <button type="submit" (click)="delete(responseGroup.id!)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
              <fa-icon icon="times"></fa-icon>
              <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
