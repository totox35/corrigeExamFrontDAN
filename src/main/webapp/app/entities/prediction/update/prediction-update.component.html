<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-prediction-heading"
        data-cy="PredictionCreateUpdateHeading"
        jhiTranslate="gradeScopeIsticApp.prediction.home.createOrEditLabel"
      >
        Create or edit a Prediction
      </h2>
      <div>
        <jhi-alert-error></jhi-alert-error>
        <div class="row mb-3" [hidden]="editForm.get('id')!.value == null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input
            type="number"
            (mouseup)="$event.stopPropagation()"
            class="form-control"
            name="id"
            id="field_id"
            data-cy="id"
            formControlName="id"
            [readonly]="true"
          />
        </div>
        <div class="row mb-3">
          <label class="form-label" jhiTranslate="gradeScopeIsticApp.prediction.text" for="field_text">Text</label>
          <input type="text" class="form-control" name="text" id="field_text" data-cy="text" formControlName="text" />
        </div>
        <div class="row mb-3">
          <label class="form-label" jhiTranslate="gradeScopeIsticApp.prediction.questionNumber" for="field_questionNumber"
            >Question Number</label
          >
          <input
            type="number"
            class="form-control"
            name="questionNumber"
            id="field_questionNumber"
            data-cy="questionNumber"
            formControlName="questionNumber"
          />
        </div>
        <div class="row mb-3">
          <label class="form-label" jhiTranslate="gradeScopeIsticApp.prediction.sheetId" for="field_sheetId">Sheet ID</label>
          <input type="number" class="form-control" name="sheetId" id="field_sheetId" data-cy="sheetId" formControlName="sheetId" />
        </div>
        <div class="row mb-3">
          <label class="form-label" jhiTranslate="gradeScopeIsticApp.prediction.question" for="field_question">Question</label>
          <select class="form-control" id="field_question" name="question" formControlName="questionId">
            <option [ngValue]="null"></option>
            <option [ngValue]="questionOption.id" *ngFor="let questionOption of questions; trackBy: trackById">
              {{ questionOption.id }}
            </option>
          </select>
        </div>
      </div>
      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>
        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
