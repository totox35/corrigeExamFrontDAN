<div class="entity-list">
  <h2 jhiTranslate="global.menu.entities.list.predictionlist">Prediction List</h2>
  <div class="mb-3">
    <input #questionId type="number" class="form-control w-25 d-inline me-2" placeholder="Enter Exam ID" />
    <button
      type="button"
      class="btn btn-danger"
      jhiTranslate="global.menu.entities.list.delpredictionbyid"
      (click)="deleteByQuestion(questionId.value)"
    >
      <i class="fa fa-trash"></i> Delete All Predictions for Exam
    </button>
    <button
      type="button"
      class="btn btn-danger"
      jhiTranslate="global.menu.entities.list.delallpredictions"
      (click)="deleteAllPredictions()"
    >
      <i class="fa fa-trash"></i> Delete All Predictions
    </button>
  </div>
  <table class="table table-striped">
    <thead>
      <tr>
        <th jhiTranslate="global.menu.entities.list.id">ID</th>
        <th jhiTranslate="global.menu.entities.list.questionid">Id de Question</th>
        <th jhiTranslate="global.menu.entities.list.predictiontext">Prediction Text</th>
        <th jhiTranslate="global.menu.entities.list.actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let prediction of predictions">
        <td>{{ prediction.id }}</td>
        <td>{{ prediction.questionId }}</td>
        <td>{{ prediction.text }}</td>
        <td>
          <div class="btn-group">
            <button
              type="submit"
              [routerLink]="['/prediction', prediction.id, 'view']"
              class="btn btn-info btn-sm"
              data-cy="entityDetailsButton"
            >
              <i class="fa fa-eye"></i>
              <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
            </button>

            <button
              type="submit"
              [routerLink]="['/prediction', prediction.id, 'edit']"
              class="btn btn-primary btn-sm"
              data-cy="entityEditButton"
            >
              <i class="fa fa-pencil-alt"></i>
              <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
            </button>

            <button type="submit" (click)="delete(prediction.id!)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
              <i class="fa fa-times"></i>
              <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
